name: scanner

on:
  schedule:
    # Tier 3 Polymarket scanner: every 6 hours at :19
    - cron: '19 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner-job
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Polymarket scanner cycle
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run_scanner.py

      - name: Commit journal (lossless merge on conflict)
        run: bash tools/safe_commit.sh "journal update (scanner) $(date -u +'%Y-%m-%d %H:%M')"
