name: chat

on:
  schedule:
    # Discord chat reader: every 15 min, offset between the trade crons
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chat-job
  cancel-in-progress: false

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Discord chat cycle
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python run_chat.py

      - name: Commit journal (lossless merge on conflict)
        run: bash tools/safe_commit.sh "journal update (chat) $(date -u +'%Y-%m-%d %H:%M')"
