name: futures

on:
  schedule:
    # Tier 5 futures cycle: hourly, offset from agent (:11) and memecoin (:37)
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futures-job
  cancel-in-progress: false

jobs:
  futures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Tier 5 futures cycle (sweep + signals + gated entries)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python tools/tier5.py cycle

      - name: Commit journal (lossless merge on conflict)
        run: bash tools/safe_commit.sh "journal update (futures) $(date -u +'%Y-%m-%d %H:%M')"
