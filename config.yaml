# Trading sandbox agent configuration
# All parameters for the bot

# Broker backend for Tier 1 execution:
#   alpaca        - Alpaca paper trading (needs ALPACA_API_KEY_ID/SECRET in .env)
#   binance_paper - local simulated account priced by keyless Binance public
#                   data (state persists in data/trades.db journal meta)
broker:
  name: binance_paper
  paper:
    start_cash: 20
  taker_fee_pct: 0.1
  slippage_bps: 8

# Alpaca paper trading credentials (loaded from .env, only used when broker.name = alpaca)
# API keys are read from environment variables: ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY

# Trading symbols (editable)
symbols:
  - BTC/USD
  - ETH/USD
  - SOL/USD

# Strategy parameters
sma_fast: 20
sma_slow: 50

# Position sizing (paper notional per trade in USD)
notional: 100

# Conservative assumptions used only for research/backtests and paper fills.
# Binance spot taker fee is 0.1%.
execution:
  taker_fee_pct: 0.25
  slippage_bps: 8

# Report delivery
report_channel: null  # legacy; Discord delivery uses DISCORD_WEBHOOK_URL

# Other
timeframe: 15Min  # Alpaca timeframe for bars
lookback_bars: 120  # Number of bars to fetch for SMA calculation

# Strategies registered for the trading loop (names map to bot/strategies/)
active_strategies:
  - sma_cross

# Risk controls (checked before every order; SELLs always allowed)
risk:
  max_notional_per_trade: 100
  max_open_positions: 3
  daily_loss_limit_pct: 5.0
  flatten_on_daily_loss: true
  target_risk_pct_per_trade: 0.5
  # scaled for the $20 binance_paper ledger (15% of $20 would only allow $3 deployed)
  max_crypto_allocation_pct: 75.0
  atr_period: 14
  catastrophic_atr_multiple: 3.0
  # Stop used only when entry-ATR is unavailable; ATR stop takes precedence
  fallback_stop_pct: 5.0

# AI agent (Tier 2) — shadow mode: proposals are logged/alerted, never executed
# on the real account. They ARE simulated on a virtual $20 shadow account.
agent:
  enabled: true
  shadow: true
  cycle_interval_minutes: 60
  min_confidence: 0.7
  max_proposed_notional: 50
  babysitter_enabled: true
  scout_enabled: true
  shadow_start_cash: 20
  shadow_max_per_position: 10
  evaluation_horizon_hours: 24

# Research tools for the agent (all free tiers)
research:
  headlines_per_symbol: 5
  tavily_daily_limit: 30
  tavily_monthly_limit: 1000

# Polymarket scanner (Tier 3) — read-only API, paper bets only
scanner:
  enabled: true
  stake: 20
  near_resolution_days: 3
  near_resolution_min_price: 0.97
  min_market_volume: 50000
  mispricing_threshold: 0.08
  max_llm_markets: 5
  friction_pct: 1.0
  min_expected_value_pct: 2.0
  max_total_open_exposure: 100
  near_resolution_watchlist_only: true  # false = allow paper bets on near-resolution favorites (>= 12h to close)
  # Tier 3 betting wallet (virtual $10, mirrors real deployment size)
  wallet_start_cash: 10
  wallet_stake: 2
