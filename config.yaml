# Trading sandbox agent configuration
# All parameters for the bot

# Broker backend for Tier 1 execution:
#   alpaca        - Alpaca paper trading (needs ALPACA_API_KEY_ID/SECRET in .env)
#   binance_paper - local simulated account priced by keyless Binance public
#                   data (state persists in data/trades.db journal meta)
broker:
  name: binance_paper
  paper:
    start_cash: 100
  taker_fee_pct: 0.1
  slippage_bps: 8

# Alpaca paper trading credentials (loaded from .env, only used when broker.name = alpaca)
# API keys are read from environment variables: ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY

# Trading symbols (editable)
symbols:
  - BTC/USD
  - ETH/USD
  - SOL/USD

# Strategy parameters
sma_fast: 20
sma_slow: 50

# Position sizing (paper notional per trade in USD)
notional: 100

# Conservative assumptions used only for research/backtests and paper fills.
# Binance spot taker fee is 0.1%.
execution:
  taker_fee_pct: 0.25
  slippage_bps: 8

# Report delivery
report_channel: null  # legacy; Discord delivery uses DISCORD_WEBHOOK_URL

# Other
timeframe: 15Min  # Alpaca timeframe for bars
lookback_bars: 120  # Number of bars to fetch for SMA calculation

# Strategies registered for the trading loop (names map to bot/strategies/)
active_strategies:
  - sma_cross

# Risk controls (checked before every order; SELLs always allowed)
risk:
  max_notional_per_trade: 100
  max_open_positions: 3
  daily_loss_limit_pct: 5.0
  flatten_on_daily_loss: true
  target_risk_pct_per_trade: 0.5
  # scaled for the $100 binance_paper ledger
  max_crypto_allocation_pct: 75.0
  atr_period: 14
  catastrophic_atr_multiple: 3.0
  # Stop used only when entry-ATR is unavailable; ATR stop takes precedence
  fallback_stop_pct: 5.0

# AI agent (Tier 2) — shadow mode: proposals are logged/alerted, never executed
# on the real account. They ARE simulated on a virtual $80 shadow account.
agent:
  enabled: true
  shadow: true
  cycle_interval_minutes: 60
  min_confidence: 0.7
  max_proposed_notional: 50
  babysitter_enabled: true
  scout_enabled: true
  shadow_start_cash: 80
  shadow_max_per_position: 40
  evaluation_horizon_hours: 24
  # Scout may ALSO propose high-conviction ideas OUTSIDE the Tier 1 universe
  # (e.g. XRP, DOGE — any liquid Binance spot coin with news behind it).
  # Tier 1 execution stays hard-scoped to `symbols:`; this widens the AI's
  # idea net only. Babysitter stays scoped to held positions.
  scout_extra_universe:
    - XRP/USD
    - DOGE/USD
    - ADA/USD
    - AVAX/USD
    - LINK/USD

# Research tools for the agent (all free tiers)
research:
  headlines_per_symbol: 5
  tavily_daily_limit: 30
  tavily_monthly_limit: 1000

# Polymarket scanner (Tier 3) — read-only API, paper bets only
scanner:
  enabled: true
  stake: 20
  near_resolution_days: 3
  near_resolution_min_price: 0.97
  min_market_volume: 50000
  min_market_liquidity: 10000  # LLM candidates need real liquidity: quoted prices on thinner books are not fillable
  mispricing_threshold: 0.08
  max_llm_markets: 5
  friction_pct: 1.0
  min_expected_value_pct: 2.0
  max_total_open_exposure: 100
  near_resolution_watchlist_only: true  # false = allow paper bets on near-resolution favorites (>= 12h to close)
  # Tier 3 betting wallet (virtual $60, mirrors real deployment size)
  wallet_start_cash: 60
  wallet_stake: 12

# Tier 4 memecoin canary — automated (owner opt-in 2026-09-08, virtual money
# only). Pipeline per hourly cycle: deterministic research cards (CoinGecko
# trending + DexScreener volume spikes) -> deep per-coin dossier (market data,
# 30d history, DEX pair profile) -> fail-closed rug-guard screen -> LLM
# conviction gate -> conviction-sized entry. Deterministic exits: entry-fixed
# SL/TP, trailing stop, partial TP, time stop, drawdown kill w/ auto re-arm.
memecoin:
  start_cash: 40          # virtual canary ledger
  max_stake: 12           # per-entry cap
  stop_loss_pct: 25       # entry-fixed stop-loss
  take_profit_pct: 50     # entry-fixed take-profit
  time_stop_hours: 72     # hard time stop
  max_drawdown_pct: 25    # hard kill: flatten all; auto re-arm after cooldown
  taker_fee_pct: 1.0      # DEX-style conservative fee
  slippage_bps: 100      # 1% adverse slippage per fill
  card_ttl_minutes: 360   # research-card dedupe window
  max_trending_cards: 7   # CoinGecko trending cap per cycle
  spike_volume_multiple: 3.0   # 6h annualized vs 24h volume multiple
  spike_min_volume_24h: 100000
  # --- automation (Tier 4 runs itself; the owner opted in 2026-09-08) ---
  auto_entry: true            # master switch: false = research-only (old behavior)
  auto_cooldown_hours: 24     # kill cooldown before entries auto-resume
  min_llm_confidence: 0.75     # LLM must be this convinced before any buy
  base_stake: 6               # stake at the confidence threshold
  max_open_positions: 3        # concurrent positions cap
  min_liquidity_usd: 250000    # rug-guard: exit liquidity floor
  min_volume_24h_usd: 500000   # rug-guard: sustained interest floor
  min_age_hours: 168           # rug-guard: must have survived >= 7 days
  max_mcap_rank: 300           # rug-guard: no micro-cap obscurities
  trailing_stop_pct: 20        # trail distance once activated
  trailing_activate_pct: 25    # arm the trail after +25%
  partial_tp_pct: 80           # bank half at +80%
  partial_tp_sell_frac: 0.5    # fraction sold at the partial TP
  entry_cooldown_hours: 168    # no re-entry into a symbol for 7 days after any exit
